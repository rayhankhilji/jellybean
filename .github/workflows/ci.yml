name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify the server starts and speaks MCP
        shell: bash
        run: |
          # A trivial initialize handshake over stdio. Catches the class of
          # failure where everything compiles but the server cannot connect.
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}' \
            | node dist/index.js . \
            | grep -q '"serverInfo"'
          echo "handshake ok"

      - name: Verify --doctor reports a healthy setup and changes nothing
        shell: bash
        run: |
          node dist/index.js --doctor .
          # The doctor is what people are told to run when something is wrong, so
          # it has to work on every platform — including the one where file
          # watching behaves differently.
          test -z "$(git status --porcelain)" || {
            echo "--doctor modified the working tree:"; git status --porcelain; exit 1;
          }

      - name: Verify the published package installs and runs
        shell: bash
        run: |
          # `files` and `bin` are easy to get wrong in a way nothing else
          # catches: the repository works, and the thing people install does not.
          npm pack --silent
          tarball=$(ls jellybean-mcp-*.tgz)
          workdir=$(mktemp -d)
          cp "$tarball" "$workdir/"
          cd "$workdir"
          npm init -y > /dev/null
          npm install --silent "./$tarball"
          ./node_modules/.bin/jellybean --version
          mkdir -p sample && echo 'export const value = 1;' > sample/index.ts
          ./node_modules/.bin/jellybean --doctor sample
